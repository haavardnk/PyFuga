[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyFuga"
version = "0.1.0"
description = "Linearised CFD wake model (PyFuga)"
readme = "README.md"
authors = [
  { name = "PyFuga team", email = "njoga@dtu.dk" },
]
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "xarray",
  "tqdm",
  "h5netcdf",
  "numba",
]

[project.optional-dependencies]
tests = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "memory_profiler>=0.61.0",
  "line_profiler>=5.0.0",
]

lint = [
  "ruff>=0.14.8",
  "black[jupyter]>=25.12.0",
  "mypy>=1.15",
]

docs = [
  "sphinx>=8.1",
  "sphinx-autobuild>=2024.10",
  "sphinx_rtd_theme>=3.0",
  "nbsphinx>=0.9.7",
  "sphinxcontrib-bibtex>=2.6",
  "sphinx-multiversion>=0.2.4",
  "sphinx-copybutton>=0.5.2",
]

# Convenience group for local development
dev = [
  "PyFuga[tests,lint,docs]",
]

[tool.setuptools]
packages = ["pyfuga"]

# --------------------------------------------------------------------------------------------------
# Black configuration
# --------------------------------------------------------------------------------------------------

[tool.black]
line-length = 120
target-version = ["py310"]
extend-exclude = """
(
  ^docs/_build/
  | ^.pixi/
  | ^.git/
  | ^.pytest_cache/
  | ^.ruff_cache/
  | ^.mypy_cache/
  | ^.vscode/
  | ^.gitlab/
)
"""

# --------------------------------------------------------------------------------------------------
# Ruff configuration (replaces pylint + pycodestyle + isort)
# --------------------------------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # import sorting (replaces isort)
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
  "C4",  # comprehensions
]

ignore = [
  "E203",  # whitespace before ':', conflicts with black
]

[tool.ruff.lint.isort]
known-first-party = ["pyfuga"]
