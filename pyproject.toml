[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfuga"
version = "0.1.0"
description = "Linearised CFD wake model (PyFuga)"
readme = "README.md"
authors = [
  { name = "PyFuga team", email = "lalc@dtu.dk" },
]
requires-python = ">=3.10, <3.15"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.10",
  "matplotlib>=3.10.8",
  "xarray>=2025.6.1",
  "tqdm>=4.67.3",
  "h5netcdf>=1.8.1",
  "h5py>=3.15.1",
  "numba>=0.63.1",
]

[project.optional-dependencies]
tests = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "memory_profiler>=0.61.0",
  "line_profiler>=5.0.0",
  "nbconvert>=7.16.6,<8",
  "ipykernel>=6.29,<7",
  "jupyter_client>=8.6,<9"
]

lint = [
  "ruff>0.14",
  "black[jupyter]>=26.1.0",
  "mypy>=1.19.1",
]

docs = [
  "sphinx>=8.1,<9",
  "sphinx-autobuild>=2024.10",
  "sphinx_rtd_theme>=3.0",
  "sphinx-rtd-dark-mode>=1.3.0",
  "nbsphinx>=0.9.7",
  "sphinxcontrib-bibtex>=2.6",
  "sphinx-multiversion>=0.2.4",
  "sphinx-copybutton>=0.5.2",
  "ipykernel>=6.29",
]

# Convenience group for local development
dev = [
  "pyfuga[tests,lint,docs]",
  "pre-commit"
]

[tool.setuptools]
packages = ["pyfuga"]

# --------------------------------------------------------------------------------------------------
# Pixi configuration
# --------------------------------------------------------------------------------------------------

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64", "osx-64"]

[tool.pixi.dependencies]
pip = ">=25.2,<26"

[tool.pixi.pypi-dependencies]
pyfuga = { path = ".", editable = true, extras = ["dev"] }

[tool.pixi.tasks]
# Use Pixi to run the tools from the editable install
test = "pytest --cov-report term-missing:skip-covered --cov=pyfuga --cov-config .coveragerc --import-mode=importlib"
lint = "ruff check ."
fmt-check = "black --check ."

docs = "rm -rf docs/_build && rm -rf docs/api/generated && NUMBA_DISABLE_JIT=1 sphinx-build -b html docs docs/_build"

docs-multi = { cmd = [
  "bash", "-lc",
  """
  set -euo pipefail

  git fetch --unshallow --tags 2>/dev/null || git fetch --tags
  git fetch origin "+refs/heads/*:refs/remotes/origin/*"

  NUMBA_DISABLE_JIT=1 sphinx-multiversion docs docs/_build

  git fetch --tags
  LATEST_TAG="$(git describe --tags "$(git rev-list --tags --max-count=1)" 2>/dev/null || echo "")"

  if [ -n "$LATEST_TAG" ] && [ -d "docs/_build/$LATEST_TAG" ]; then
    DEFAULT_REF="$LATEST_TAG"
  else
    DEFAULT_REF="main"
  fi

  echo "Using DEFAULT_REF=${DEFAULT_REF}"
  sed "s/TAG/${DEFAULT_REF}/g" docs/root_index_template.html > docs/_build/index.html
  """
] }

serve-docs = "python -m http.server --directory docs/_build 8000"

docs-autobuild = """
sphinx-autobuild docs docs/_build \
  --port 8000 \
  --watch pyfuga \
  --open-browser
"""

style = { depends-on = ["fmt-check", "lint"] }
ci = { depends-on = ["style", "test", "docs"] }
full-ci = { depends-on = ["style", "test", "docs-multi"] }

# Pin per-environment Python versions (so Pixi doesn't pick 3.14 etc.)
[tool.pixi.feature.py310.dependencies]
python = "3.10.*"
numpy = ">=1.26,<2"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
numpy = ">=1.26,<2"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
numpy = ">=1.26,<2.4"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"
numpy = ">=2.3.2,<2.4"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"
numpy = ">=2.3.2,<2.4"

[tool.pixi.environments]
py310 = ["py310"]
py311 = ["py311"]
py312 = ["py312"]
py313 = ["py313"]
py314 = ["py314"]

# --------------------------------------------------------------------------------------------------
# Black configuration
# --------------------------------------------------------------------------------------------------

[tool.black]
line-length = 120
target-version = ["py312"]
extend-exclude = """
(
  ^docs/_build/
  | ^.pixi/
  | ^.git/
  | ^.pytest_cache/
  | ^.ruff_cache/
  | ^.mypy_cache/
  | ^.vscode/
  | ^.gitlab/
)
"""

# --------------------------------------------------------------------------------------------------
# Ruff configuration (replaces pylint + pycodestyle + isort)
# --------------------------------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # import sorting (replaces isort)
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
  "C4",  # comprehensions
]

ignore = [
  "E203",  # whitespace before ':', conflicts with black
]

[tool.ruff.lint.isort]
known-first-party = ["pyfuga"]

# --------------------------------------------------------------------------------------------------
# Pytest configuration
# --------------------------------------------------------------------------------------------------

[tool.pytest.ini_options]
markers = [
  "local: mark test as local-only (not run in CI)",
]
