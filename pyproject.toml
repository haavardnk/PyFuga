[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfuga"
version = "0.1.0"
description = "Linearised CFD wake model (PyFuga)"
readme = "README.md"
authors = [{ name = "PyFuga team", email = "lalc@dtu.dk" }]
license = "MIT"
# Note: Keep in sync with [tool.pyfuga] min-python-version and supported-python-versions
requires-python = ">=3.10, <3.15"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.10",
  "matplotlib>=3.10.8",
  "xarray>=2025.6.1",
  "tqdm>=4.67.3",
  "h5netcdf>=1.8.1",
  "h5py>=3.15.1",
  "numba>=0.63.1",
]

[project.urls]
Repository = "https://gitlab.windenergy.dtu.dk/TOPFARM/cuttingedge/pywake/fuga/pyfuga"
Documentation = "https://topfarm.pages.windenergy.dtu.dk/cuttingedge/pywake/fuga/PyFuga/"
Issues = "https://gitlab.windenergy.dtu.dk/TOPFARM/cuttingedge/pywake/fuga/pyfuga/-/issues"

[project.optional-dependencies]
tests = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "memory_profiler>=0.61.0",
  "line_profiler>=5.0.0",
  "nbconvert>=7.16.6,<8",
  "ipykernel>=6.29,<7",
  "jupyter_client>=8.6,<9",
]

lint = ["ruff>0.14", "black[jupyter]>=26.1.0", "mypy>=1.19.1"]

docs = [
  "sphinx>=8.1,<9",
  "sphinx-autobuild>=2024.10",
  "sphinx_rtd_theme>=3.0",
  "sphinx-rtd-dark-mode>=1.3.0",
  "nbsphinx>=0.9.7",
  "sphinxcontrib-bibtex>=2.6",
  "sphinx-multiversion>=0.2.4",
  "sphinx-copybutton>=0.5.2",
  "ipykernel>=6.29",
]

# Convenience group for local development
dev = ["pyfuga[tests,lint,docs]", "pre-commit"]

[tool.setuptools]
packages = { find = { include = ["pyfuga*"], exclude = ["constraints*", "tests*", "docs*", "build*"] } }

# --------------------------------------------------------------------------------------------------
# Pixi configuration
# --------------------------------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[tool.pixi.dependencies]
pip = ">=25.2,<26"

[tool.pixi.pypi-dependencies]
pyfuga = { path = ".", editable = true, extras = ["dev"] }

[tool.pixi.tasks]
# Formatting
check-fmt = "black --check . && ruff check ."
fmt = "black . && ruff check . --fix"

# Testing
test = "pytest --cov-report term-missing:skip-covered --cov=pyfuga --cov-config .coveragerc --import-mode=importlib"

# Documentation
build-docs = "rm -rf docs/_build && rm -rf docs/api/generated && NUMBA_DISABLE_JIT=1 sphinx-build -b html docs docs/_build"
autobuild-docs = """
sphinx-autobuild docs docs/_build \
  --port 8000 \
  --watch pyfuga \
  --open-browser
"""

# Debugging
doctor = "python scripts/dev.py doctor"

# CI
ci = { depends-on = ["test", "check-fmt", "build-docs"] }

# Pin per-environment Python versions (so Pixi doesn't pick 3.14 etc.)
[tool.pixi.feature.py310.dependencies]
python = "3.10.*"
numpy = ">=1.26,<2.4"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
numpy = ">=1.26,<2.4"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
numpy = ">=1.26,<2.4"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"
numpy = ">=2.3.2,<2.4"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"
numpy = ">=2.3.2,<2.4"

[tool.pixi.environments]
py310 = ["py310"]
py311 = ["py311"]
py312 = ["py312"]
py313 = ["py313"]
py314 = ["py314"]

# --------------------------------------------------------------------------------------------------
# Black configuration
# --------------------------------------------------------------------------------------------------

[tool.black]
line-length = 120
target-version = ["py310"]
extend-exclude = """
(
  ^docs/_build/
  | ^.pixi/
  | ^.git/
  | ^.pytest_cache/
  | ^.ruff_cache/
  | ^.mypy_cache/
  | ^.vscode/
  | ^.gitlab/
)
"""

# --------------------------------------------------------------------------------------------------
# Ruff configuration (replaces pylint + pycodestyle + isort)
# --------------------------------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # import sorting (replaces isort)
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
  "C4",  # comprehensions
]

ignore = [
  "E203", # whitespace before ':', conflicts with black
]

[tool.ruff.lint.isort]
known-first-party = ["pyfuga"]

# --------------------------------------------------------------------------------------------------
# PyFuga project configuration
# --------------------------------------------------------------------------------------------------

[tool.pyfuga]
# Minimum supported Python version (used for linting target-version)
min-python-version = "3.10"
# All supported Python versions (used for CI/testing matrix)
supported-python-versions = ["3.10", "3.11", "3.12", "3.13", "3.14"]

# --------------------------------------------------------------------------------------------------
# Pytest configuration
# --------------------------------------------------------------------------------------------------

[tool.pytest.ini_options]
markers = ["local: mark test as local-only (not run in CI)"]
