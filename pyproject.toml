[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyFuga"
version = "0.1.0"
description = "Linearised CFD wake model (PyFuga)"
readme = "README.md"
authors = [
  { name = "PyFuga team", email = "njoga@dtu.dk" },
]
requires-python = "==3.12.*"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.10",
  "matplotlib>=3.10.8",
  "xarray>=2025.6.1",
  "tqdm>=4.67.3",
  "h5netcdf>=1.8.1",
  "h5py>=3.15.1",
  "numba>=0.63.1",
]

[project.optional-dependencies]
tests = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "memory_profiler>=0.61.0",
  "line_profiler>=5.0.0",
  "nbconvert>=7.16.6,<8",
  "ipykernel>=6.29,<7",
  "jupyter_client>=8.6,<9"
]

lint = [
  "ruff==0.14.8",
  "black[jupyter]==26.1.0",
  "mypy>=1.19.1",
]

docs = [
  "sphinx>=8.1",
  "sphinx-autobuild>=2024.10",
  "sphinx_rtd_theme>=3.0",
  "sphinx-rtd-dark-mode>=1.3.0",
  "nbsphinx>=0.9.7",
  "sphinxcontrib-bibtex>=2.6",
  "sphinx-multiversion>=0.2.4",
  "sphinx-copybutton>=0.5.2",
  "ipykernel>=6.29,<7",
]

# Convenience group for local development
dev = [
  "PyFuga[tests,lint,docs]",
  "pre-commit"
]

[tool.setuptools]
packages = ["pyfuga"]

# --------------------------------------------------------------------------------------------------
# Black configuration
# --------------------------------------------------------------------------------------------------

[tool.black]
line-length = 120
target-version = ["py312"]
extend-exclude = """
(
  ^docs/_build/
  | ^.pixi/
  | ^.git/
  | ^.pytest_cache/
  | ^.ruff_cache/
  | ^.mypy_cache/
  | ^.vscode/
  | ^.gitlab/
)
"""

# --------------------------------------------------------------------------------------------------
# Ruff configuration (replaces pylint + pycodestyle + isort)
# --------------------------------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # import sorting (replaces isort)
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
  "C4",  # comprehensions
]

ignore = [
  "E203",  # whitespace before ':', conflicts with black
]

[tool.ruff.lint.isort]
known-first-party = ["pyfuga"]
