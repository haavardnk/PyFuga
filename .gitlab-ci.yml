image: continuumio/anaconda3

# ===== Test PyFuga =====
test_PyFuga:
  stage: test
  script:
    - python -m pip install --upgrade pip --user
    - python -m pip install ".[tests]" --user
    - python -m pytest --cov-report term-missing:skip-covered --cov=pyfuga --cov-config .coveragerc --import-mode=importlib
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  tags:
  - ci-ubuntu

# ===== Check formatting with Black =====
check_black:
  stage: test
  script:
    - python -m pip install --upgrade pip --user
    - python -m pip install ".[lint]" --user
    - python -m black --check .
  tags:
    - python

# ===== Check imports and linting with Ruff =====
check_ruff:
  stage: test
  script:
    - python -m pip install --upgrade pip --user
    - python -m pip install ".[lint]" --user
    - python -m ruff check .
  tags:
    - python

# ===== Build PyFuga docs =====
pages:
  stage: deploy
  script:
  - apt-get update
  - apt-get -y install make pandoc
  - python -m pip install --upgrade pip --user
  - python -m pip install ".[docs]" --user
  - cd docs
  - python -m sphinx-build -b html . _build
  # - sphinx-multiversion . _build
  - cd ../
  - mv docs/_build public/
  artifacts:
    paths:
      - public
  tags:
  - ci-ubuntu
  only:
    - main
    - /^docs.*$/
