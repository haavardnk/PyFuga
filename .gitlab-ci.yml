stages:
  - image
  - test
  - deploy

# ===== Reusable configurations =====
# Supported Python versions (defined in pyproject.toml [tool.pyfuga])
.python_versions: &python_versions
  - "3.10"
  - "3.11"
  - "3.12"
  - "3.13"
  - "3.14"

# ===== Cap resource limits for CI jobs =====
variables:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHON_DEFAULT_VERSION: "3.12"
  PYTHON_DEFAULT_VERSION_TAG: "312"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_LINK_MODE: "copy"

cache:
  key: "uv-${CI_PROJECT_ID}-${CI_JOB_NAME}"
  paths:
    - .cache/uv/
  policy: pull-push

# ===== Workflow =====
workflow:
  rules:
    # Don't use merge request pipelines
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: always

# ===== Image stage =====
build_ci_image:
  stage: image
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  cache: []
  parallel:
    matrix:
      - PYTHON_VERSION: *python_versions
      - TARGET: ["base", "docs"]
  variables:
    CI_IMAGE_REPO: "${CI_REGISTRY_IMAGE}/ci/python-${PYTHON_VERSION}-uv"
    CI_IMAGE_REPO_DOCS: "${CI_REGISTRY_IMAGE}/ci/python-${PYTHON_VERSION}-uv-docs"
  script:
    # Authenticate to the GitLab registry using the built-in CI variables
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "${CI_REGISTRY}": {
            "username": "${CI_REGISTRY_USER}",
            "password": "${CI_REGISTRY_PASSWORD}"
          }
        }
      }
      EOF

    # Build and push
    - |
      if [ "$TARGET" = "base" ]; then
        REPO="${CI_IMAGE_REPO}"
        BUILD_TARGET="base"
      else
        REPO="${CI_IMAGE_REPO_DOCS}"
        BUILD_TARGET="docs"
      fi

      DEST_SHA="${REPO}:${CI_COMMIT_SHA}"
      DEST_LATEST="${REPO}:latest"

      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/ci/Dockerfile" \
        --build-arg "PYTHON_VERSION=${PYTHON_VERSION}" \
        --target "$BUILD_TARGET" \
        --destination "$DEST_SHA" \
        --destination "$DEST_LATEST" \

  rules:
    # Rebuild automatically when the Dockerfile changes
    - changes:
        - ci/Dockerfile
      when: on_success
      allow_failure: false
    # Otherwise allow manual rebuilds from the UI
    - when: manual
      allow_failure: true
  tags:
    - docker
    - ubuntu
    - linux

# ===== Set default Python version =====
image: ${CI_REGISTRY_IMAGE}/ci/python-${PYTHON_DEFAULT_VERSION}-uv:latest

# ===== Defaults / reusable bits =====
.default_python_job: &default_python_job
  tags:
    - docker
    - ubuntu
    - linux
  before_script:
    # Environment setup
    - export UV_CACHE_DIR="${UV_CACHE_DIR:-$CI_PROJECT_DIR/.cache/uv}"
    - export UV_LINK_MODE="${UV_LINK_MODE:-copy}"
    - echo "UV_CACHE_DIR=$UV_CACHE_DIR"

    # Runner identification
    - echo "=== Runner Info ==="
    - echo "Hostname:$(hostname)"
    - echo "Runner:${CI_RUNNER_DESCRIPTION:-unknown}"
    - echo "Runner ID:${CI_RUNNER_ID:-unknown}"
    - echo "Runner tags:${CI_RUNNER_TAGS:-unknown}"

    # Disk space monitoring
    - echo "=== Disk Space ==="
    - df -h
    - echo "=== Disk Inodes ==="
    - df -i | head -n 1; df -i | grep -E '(/dev/|Filesystem)' || true

    # Memory monitoring
    - echo "=== Memory Usage ==="
    - free -h || true

    # Docker info (if accessible)
    - echo "=== Docker Info ==="
    - docker info 2>/dev/null | grep -E '(Storage Driver|Docker Root Dir|Logging Driver|Cgroup)' || echo "Docker info not accessible (expected in jobs)"
    - docker system df 2>/dev/null || echo "Docker system df not accessible (expected in jobs)"

    # Cache sizes
    - echo "=== Cache Sizes ==="
    - du -sh /cache 2>/dev/null || true
    - du -sh "$UV_CACHE_DIR" 2>/dev/null || true
    - du -sh /root/.cache 2>/dev/null || true
    - du -sh "$CI_PROJECT_DIR" || true

    # Tool versions
    - echo "=== Tool Versions ==="
    - python -V
    - uv --version

# ===== Test stage =====

# ----- Test PyFuga (quick, every push) -----
pytest_pyfuga_default_python_version:
  stage: test
  <<: *default_python_job
  script:
    - |
      PYV="${PYTHON_DEFAULT_VERSION/./}"          # "3.12" -> "312"
      CONSTRAINT="constraints/py${PYV}.txt"
      test -f "${CONSTRAINT}" || (echo "Missing constraints file: ${CONSTRAINT}"; exit 1)
      echo "Using constraints: ${CONSTRAINT}"
      VENV_DIR=".venv-${CI_JOB_ID}"
      uv venv "${VENV_DIR}"
      . "${VENV_DIR}/bin/activate"
      uv pip install -c "${CONSTRAINT}" ".[tests]"
    - python -m pytest --cov-report term-missing:skip-covered --cov=pyfuga --cov-config .coveragerc --import-mode=importlib -m "not local" tests/
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    paths:
      - tests/notebook_outputs/*.html
    when: always
  rules:
    # Only on changed code
    - changes:
        - pyfuga/**/*
        - tests/**/*
        - constraints/**/*
        - pyproject.toml
        - .coveragerc
        - .gitlab-ci.yml
      when: on_success
      allow_failure: false
    - when: manual
      allow_failure: true

# ----- Test PyFuga on Windows (Stage 1: default Python only) -----
pytest_pyfuga_windows_default_python_version:
  stage: test
  image: registry.windenergy.dtu.dk/dockerimages/windows-python:ltsc2019_py${PYTHON_DEFAULT_VERSION_TAG}
  cache: []
  tags:
    - docker-windows
  script:
    # Install PyFuga with test dependencies and pinned constraints for Python 3.12
    - pip install -c "constraints/py${PYTHON_DEFAULT_VERSION_TAG}.txt" ".[tests]"

    # Run the same test command as the default Linux CI job
    - python -m pytest --cov-report term-missing:skip-covered --cov=pyfuga --cov-config .coveragerc --import-mode=importlib -m "not local" tests/
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  rules:
    # Only on changed code
    - changes:
        - pyfuga/**/*
        - tests/**/*
        - constraints/**/*
        - pyproject.toml
        - .coveragerc
        - .gitlab-ci.yml
      when: on_success
      allow_failure: false
    - when: manual
      allow_failure: true

# ----- Test PyFuga (full matrix, only when required) -----
pytest_pyfuga_all_python_versions:
  stage: test
  image: ${CI_REGISTRY_IMAGE}/ci/python-${PYTHON_VERSION}-uv:latest
  parallel:
    matrix:
      - PYTHON_VERSION: *python_versions
  <<: *default_python_job
  script:
    # Install PyFuga with test dependencies and version-specific constraints
    - |
      PYV="${PYTHON_VERSION/./}"          # "3.10" -> "310"
      CONSTRAINT="constraints/py${PYV}.txt"
      test -f "${CONSTRAINT}" || (echo "Missing constraints file: ${CONSTRAINT}"; exit 1)
      echo "Using constraints: ${CONSTRAINT}"
      VENV_DIR=".venv-${CI_JOB_ID}"
      uv venv "${VENV_DIR}"
      . "${VENV_DIR}/bin/activate"
      uv pip install -c "${CONSTRAINT}" ".[tests]"

    # Run tests with coverage
    - python -m pytest --cov-report term-missing:skip-covered --cov=pyfuga --cov-config .coveragerc --import-mode=importlib -m "not local" tests/
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    paths:
      - tests/notebook_outputs/*.html
    when: always
  rules:
    # Don't run the matrix job for the default Python (covered by the previous job)
    - if: "$PYTHON_VERSION == $PYTHON_DEFAULT_VERSION"
      when: never

    # Run on main (post-merge) to keep main honest
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
      allow_failure: false

    # Run on tags/releases
    - if: "$CI_COMMIT_TAG"
      when: on_success
      allow_failure: false

    # Otherwise, don't run by default
    - when: manual
      allow_failure: false

# ----- Check formatting, imports and linting with Black and Ruff -----
check_formatting_and_linting:
  stage: test
  <<: *default_python_job
  script:
    - VENV_DIR=".venv-${CI_JOB_ID}"
    - uv venv "${VENV_DIR}"
    - . "${VENV_DIR}/bin/activate"
    - uv pip install ".[lint]"
    - python -m black --version
    - python -m black --check .
    - python -m ruff --version
    - python -m ruff check .

# ----- Build docs on every push (for preview / CI sanity) -----
build_docs_preview:
  stage: test
  <<: *default_python_job
  image: ${CI_REGISTRY_IMAGE}/ci/python-${PYTHON_DEFAULT_VERSION}-uv-docs:latest
  script:
    - VENV_DIR=".venv-${CI_JOB_ID}"
    - uv venv "${VENV_DIR}"
    - . "${VENV_DIR}/bin/activate"
    - uv pip install ".[docs]"
    - cd docs
    - sphinx-build -b html . _build # for branch builds, a simple single-version build is enough
  artifacts:
    paths:
      - docs/_build
    expire_in: 1 week
  rules:
    # Never run on main, since main will use the Pages job below to build the full multiversion docs for the official site
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: never

    # Also skip on tags, since they will also trigger the Pages job which builds the full multiversion docs
    - if: "$CI_COMMIT_TAG"
      when: never

    # Auto if branch name contains "docs"
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH =~ /^docs\//'
      when: on_success
      allow_failure: false

    # Otherwise manual
    - when: manual
      allow_failure: true

# ===== Deploy stage =====

# ----- Build PyFuga docs for GitLab Pages (official site) -----
build_docs_for_pages:
  stage: deploy
  <<: *default_python_job
  image: ${CI_REGISTRY_IMAGE}/ci/python-${PYTHON_DEFAULT_VERSION}-uv-docs:latest
  script:
    - VENV_DIR=".venv-${CI_JOB_ID}"
    - uv venv "${VENV_DIR}"
    - . "${VENV_DIR}/bin/activate"
    - uv pip install ".[docs]"

    # --- Make sure sphinx-multiversion can see refs ------------
    # Fetch complete history (in case job is still shallow)
    - git fetch --unshallow --tags || git fetch --tags
    # Fetch all remote branches as local remote-tracking branches
    - git fetch origin "+refs/heads/*:refs/remotes/origin/*"
    # -----------------------------------------------------------

    - cd docs
    - sphinx-multiversion . _build

    # --- Choose default ref for root index.html safely ---------
    # Find latest tag (if any)
    - git fetch --tags
    - LATEST_TAG=$(git describe --tags "$(git rev-list --tags --max-count=1)" 2>/dev/null || echo "")

    # Use latest tag *only if* sphinx-multiversion built docs for it, else fallback to main
    - if [ -n "$LATEST_TAG" ] && [ -d "_build/$LATEST_TAG" ]; then DEFAULT_REF="$LATEST_TAG"; else DEFAULT_REF="main"; fi
    - echo "Using DEFAULT_REF=${DEFAULT_REF}"

    # Create root index.html from template
    - sed "s/TAG/${DEFAULT_REF}/g" root_index_template.html > _build/index.html
    # -----------------------------------------------------------

    - cd ..
    - mv docs/_build public/
  artifacts:
    paths:
      - public
  rules:
    # Only build and deploy docs for main branch and tags (releases)
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
      when: on_success
      allow_failure: false

    # Otherwise never run
    - when: never
