stages:
  - test
  - deploy

image: python:3.12-slim

# ===== Cap resource limits for CI jobs =====
variables:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

# ===== Defaults / reusable bits =====
.default_python_job: &default_python_job
  before_script:
    - python -V
    - python -m pip install --root-user-action=ignore --upgrade pip
    - python -m pip install --root-user-action=ignore uv

# ===== Test stage =====

# ----- Test PyFuga -----
test_PyFuga:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12"]
  <<: *default_python_job
  script:
    # Install test extras
    - uv pip install --system ".[tests]"

    # Debug versions in CI logs
    - python -c "import numpy, numba, llvmlite; print("numpy", numpy.__version__); print("numba", numba.__version__); print("llvmlite", llvmlite.__version__)"

    # Run tests with coverage
    - python -m pytest --cov-report term-missing:skip-covered --cov=pyfuga --cov-config .coveragerc --import-mode=importlib -m "not local" tests/
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    paths:
      - tests/notebook_outputs/*.html
    when: always
  tags:
    - python

# ----- Check formatting with Black -----
check_black:
  stage: test
  <<: *default_python_job
  script:
    - uv pip install --system ".[lint]"
    - python -m black --version
    - python -m black --check .
  tags:
    - python

# ----- Check imports and linting with Ruff -----
check_ruff:
  stage: test
  <<: *default_python_job
  script:
    - uv pip install --system ".[lint]"
    - python -m ruff --version
    - python -m ruff check .
  tags:
    - python

# ----- Build docs on every push (for preview / CI sanity) -----
docs:build:
  stage: test
  <<: *default_python_job
  script:
    - apt-get update
    - apt-get -y install make pandoc
    - uv pip install --system ".[docs]"
    - cd docs
    - sphinx-build -b html . _build  # for branch builds, a simple single-version build is enough
  artifacts:
    paths:
      - docs/_build
    expire_in: 1 week
  tags:
    - python
  except:
    - main  # main will use the Pages job below

# ===== Deploy stage =====

# ----- Build PyFuga docs for GitLab Pages (official site) -----
pages:
  stage: deploy
  <<: *default_python_job
  script:
  - apt-get update
  - apt-get -y install make pandoc git
  - uv pip install --system ".[docs]" 

  # --- Make sure sphinx-multiversion can see refs ------------
  # Fetch complete history (in case job is still shallow)
  - git fetch --unshallow --tags || git fetch --tags
  # Fetch all remote branches as local remote-tracking branches
  - git fetch origin "+refs/heads/*:refs/remotes/origin/*"
  # -----------------------------------------------------------

  - cd docs
  - sphinx-multiversion . _build

  # --- Choose default ref for root index.html safely ---------
  # Find latest tag (if any)
  - git fetch --tags
  - LATEST_TAG=$(git describe --tags "$(git rev-list --tags --max-count=1)" 2>/dev/null || echo "")

  # Use latest tag *only if* sphinx-multiversion built docs for it, else fallback to main
  - if [ -n "$LATEST_TAG" ] && [ -d "_build/$LATEST_TAG" ]; then DEFAULT_REF="$LATEST_TAG"; else DEFAULT_REF="main"; fi
  - echo "Using DEFAULT_REF=${DEFAULT_REF}"

  # Create root index.html from template
  - sed "s/TAG/${DEFAULT_REF}/g" root_index_template.html > _build/index.html
  # -----------------------------------------------------------
  
  - cd ..
  - mv docs/_build public/
  artifacts:
    paths:
      - public
  tags:
    - python
  only:
    - main
