stages:
  - image
  - test
  - deploy

# ===== Cap resource limits for CI jobs =====
variables:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHON_DEFAULT_VERSION: "3.12"

# ===== Workflow =====
workflow:
  rules:
    # Don't use merge request pipelines
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: always

# ===== Image stage =====
build_ci_image:
  stage: image
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13", "3.14"]
  variables:
    CI_IMAGE_TAG: "${CI_REGISTRY_IMAGE}/ci/python-${PYTHON_VERSION}-uv:latest"
  script:
    # Authenticate to the GitLab registry using the built-in CI variables
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "${CI_REGISTRY}": {
            "username": "${CI_REGISTRY_USER}",
            "password": "${CI_REGISTRY_PASSWORD}"
          }
        }
      }
      EOF

    # Build and push
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/ci/Dockerfile"
      --build-arg "PYTHON_VERSION=${PYTHON_VERSION}"
      --destination "${CI_IMAGE_TAG}"
  rules:
    # Rebuild automatically when the Dockerfile changes
    - changes:
        - ci/Dockerfile
      when: on_success
      allow_failure: false
    # Otherwise allow manual rebuilds from the UI
    - when: manual
      allow_failure: true
  tags:
    - docker

# ===== Set default Python version =====
image: ${CI_REGISTRY_IMAGE}/ci/python-${PYTHON_DEFAULT_VERSION}-uv:latest

# ===== Defaults / reusable bits =====
.default_python_job: &default_python_job
  before_script:
    - python -V
    - uv --version

# ===== Test stage =====

# ----- Test PyFuga (quick, every push) -----
pytest_pyfuga_default_python_version:
  stage: test
  <<: *default_python_job
  script:
    - |
      PYV="${PYTHON_DEFAULT_VERSION/./}"          # "3.12" -> "312"
      CONSTRAINT="constraints/py${PYV}.txt"
      test -f "${CONSTRAINT}" || (echo "Missing constraints file: ${CONSTRAINT}"; exit 1)
      echo "Using constraints: ${CONSTRAINT}"
      uv pip install --system -c "${CONSTRAINT}" ".[tests]"
    - python -m pytest --cov-report term-missing:skip-covered --cov=pyfuga --cov-config .coveragerc --import-mode=importlib -m "not local" tests/
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    paths:
      - tests/notebook_outputs/*.html
    when: always
  rules:
    # Only on changed code
    - changes:
        - pyfuga/**/*
        - tests/**/*
        - constraints/**/*
        - pyproject.toml
        - .coveragerc
      when: on_success
      allow_failure: false
    - when: manual
      allow_failure: true

# ----- Test PyFuga (full matrix, only when required) -----
pytest_pyfuga_all_python_versions:
  stage: test
  image: ${CI_REGISTRY_IMAGE}/ci/python-${PYTHON_VERSION}-uv:latest
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13", "3.14"]
  <<: *default_python_job
  script:
    # Install PyFuga with test dependencies and version-specific constraints
    - |
      PYV="${PYTHON_VERSION/./}"          # "3.10" -> "310"
      CONSTRAINT="constraints/py${PYV}.txt"
      test -f "${CONSTRAINT}" || (echo "Missing constraints file: ${CONSTRAINT}"; exit 1)
      echo "Using constraints: ${CONSTRAINT}"
      uv pip install --system -c "${CONSTRAINT}" ".[tests]"

    # Run tests with coverage
    - python -m pytest --cov-report term-missing:skip-covered --cov=pyfuga --cov-config .coveragerc --import-mode=importlib -m "not local" tests/
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    paths:
      - tests/notebook_outputs/*.html
    when: always
  rules:
    # Run on main (post-merge) to keep main honest
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
      allow_failure: false
    
    # Run on tags/releases
    - if: '$CI_COMMIT_TAG'
      when: on_success
      allow_failure: false

    # Otherwise, don't run by default
    - when: manual
      allow_failure: false

# ----- Check formatting, imports and linting with Black and Ruff -----
check_formatting_and_linting:
  stage: test
  <<: *default_python_job
  script:
    - uv pip install --system ".[lint]"
    - python -m black --version
    - python -m black --check .
    - python -m ruff --version
    - python -m ruff check .

# ----- Build docs on every push (for preview / CI sanity) -----
build_docs_preview:
  stage: test
  <<: *default_python_job
  script:
    - uv pip install --system ".[docs]"
    - cd docs
    - sphinx-build -b html . _build  # for branch builds, a simple single-version build is enough
  artifacts:
    paths:
      - docs/_build
    expire_in: 1 week
  rules:
    # Never run on main, since main will use the Pages job below to build the full multiversion docs for the official site
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: never
    
    # Also skip on tags, since they will also trigger the Pages job which builds the full multiversion docs
    - if: '$CI_COMMIT_TAG'
      when: never
    
    # Auto if branch name contains "docs"
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH =~ /docs/i'
      when: on_success
      allow_failure: false
    
    # Otherwise manual
    - when: manual
      allow_failure: true

# ===== Deploy stage =====

# ----- Build PyFuga docs for GitLab Pages (official site) -----
build_docs_for_pages:
  stage: deploy
  <<: *default_python_job
  script:
  - uv pip install --system ".[docs]" 

  # --- Make sure sphinx-multiversion can see refs ------------
  # Fetch complete history (in case job is still shallow)
  - git fetch --unshallow --tags || git fetch --tags
  # Fetch all remote branches as local remote-tracking branches
  - git fetch origin "+refs/heads/*:refs/remotes/origin/*"
  # -----------------------------------------------------------

  - cd docs
  - sphinx-multiversion . _build

  # --- Choose default ref for root index.html safely ---------
  # Find latest tag (if any)
  - git fetch --tags
  - LATEST_TAG=$(git describe --tags "$(git rev-list --tags --max-count=1)" 2>/dev/null || echo "")

  # Use latest tag *only if* sphinx-multiversion built docs for it, else fallback to main
  - if [ -n "$LATEST_TAG" ] && [ -d "_build/$LATEST_TAG" ]; then DEFAULT_REF="$LATEST_TAG"; else DEFAULT_REF="main"; fi
  - echo "Using DEFAULT_REF=${DEFAULT_REF}"

  # Create root index.html from template
  - sed "s/TAG/${DEFAULT_REF}/g" root_index_template.html > _build/index.html
  # -----------------------------------------------------------
  
  - cd ..
  - mv docs/_build public/
  artifacts:
    paths:
      - public
  rules:
    # Only build and deploy docs for main branch and tags (releases)
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
      when: on_success
      allow_failure: false

    # Otherwise never run
    - when: never
