# Test CI configuration (pytest, matrix testing, and linting).

# ===== Test stage =====

# ----- Test PyFuga (quick, every push) -----
test_linux_default:
  stage: test
  image: ${CI_REGISTRY_IMAGE}/ci/python-${PYTHON_DEFAULT_VERSION}-uv-tests:latest
  extends:
    - .default_python_job
    - .pytest_coverage
    - .pytest_notebook_html_artifacts
    - .rules_on_code_changes
  needs:
    - job: build_linux_test_images
      artifacts: false
      optional: true
  script:
    - python -m pytest -n 3 --dist loadfile --cov-report term-missing:skip-covered --cov=pyfuga --cov-config .coveragerc --import-mode=importlib -m "not local" tests/

# ----- Test PyFuga on Windows (Stage 1: default Python only) -----
test_windows_default:
  extends:
    - .windows_test_job
    - .rules_on_code_changes
  image:
    name: ${CI_REGISTRY_IMAGE}/ci/windows-pixi-py${PYTHON_DEFAULT_VERSION_TAG}-ci:${ENV_TAG}
    pull_policy: always
  needs:
    - job: prepare_windows_env_tag
      artifacts: true
    - job: build_windows_pixi_base
      artifacts: false
      optional: true
    - job: build_windows_pixi_envs
      artifacts: false
      optional: true
  variables:
    PIXI_ENV: "py${PYTHON_DEFAULT_VERSION_TAG}-ci"
  cache: []
  script:
    # Run tests in the matching Pixi environment for the default Python version
    - $PixiEnv = "$env:PIXI_ENV"
    - |
      $PixiEnvDir = "C:\work\.pixi\envs\$PixiEnv"
      $PythonExe = Join-Path $PixiEnvDir "python.exe"
      if (-not (Test-Path $PythonExe)) {
        throw "Expected pre-baked Python not found for $PixiEnv at $PythonExe"
      }

      if ("$env:CI_COMMIT_REF_PROTECTED" -ne "true") {
        # Compare against protected baseline to decide how to refresh the environment.
        # This captures all relevant branch changes, not only the latest push.
        git fetch origin main --quiet
        $ChangedFiles = (git diff --name-only origin/main...HEAD)
        if ($LASTEXITCODE -ne 0) { throw "Failed to diff against origin/main...HEAD" }

        $PixiLockChanged = $ChangedFiles -contains "pixi.lock"
        $PyprojectChanged = $ChangedFiles -contains "pyproject.toml"

        Push-Location "C:\work"
        if ($PixiLockChanged) {
          Write-Host "Unprotected ref: pixi.lock changed -> running frozen pixi install for $PixiEnv"
          pixi install --frozen -e $PixiEnv
          if ($LASTEXITCODE -ne 0) { throw "pixi install failed for $PixiEnv" }
        } elseif ($PyprojectChanged) {
          Write-Host "Unprotected ref: pyproject.toml changed without pixi.lock -> running editable pip install for $PixiEnv"
          & $PythonExe -m pip install -e ".[tests]"
          if ($LASTEXITCODE -ne 0) { throw "pip editable install failed for $PixiEnv" }
        } else {
          Write-Host "Unprotected ref: no pixi.lock/pyproject.toml changes -> using pre-baked $PixiEnv environment"
        }
        Pop-Location
      } else {
        Write-Host "Protected ref: using pre-baked $PixiEnv environment"
      }

      $EnvPathEntries = @(
        $PixiEnvDir,
        (Join-Path $PixiEnvDir "Library\mingw-w64\bin"),
        (Join-Path $PixiEnvDir "Library\usr\bin"),
        (Join-Path $PixiEnvDir "Library\bin"),
        (Join-Path $PixiEnvDir "Scripts"),
        (Join-Path $PixiEnvDir "bin")
      ) | Where-Object { Test-Path $_ }
      $env:PATH = ($EnvPathEntries -join ";") + ";" + $env:PATH
      $env:CONDA_PREFIX = $PixiEnvDir
      $env:CONDA_DEFAULT_ENV = $PixiEnv
      $env:CONDA_SHLVL = "1"

      & $PythonExe --version
      & $PythonExe -c "import numpy; print('numpy', numpy.__version__)"
      & $PythonExe -c "import importlib.util,sys; sys.exit(0 if importlib.util.find_spec('xdist') else 1)"
      $UseXdist = ($LASTEXITCODE -eq 0)
      $PytestArgs = @("-m", "pytest", "--import-mode=importlib", "-m", "not local", "tests/")
      if ($UseXdist) {
        Write-Host "Using pytest-xdist with 3 workers"
        $PytestArgs = @("-m", "pytest", "-n", "3", "--dist", "loadfile", "--import-mode=importlib", "-m", "not local", "tests/")
      } else {
        Write-Host "pytest-xdist not available; running serial pytest"
      }
      $Stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
      & $PythonExe @PytestArgs
      $Stopwatch.Stop()
      if ($LASTEXITCODE -ne 0) { throw "Tests failed for $PixiEnv" }
      Write-Host ("pytest (env={0}, xdist={1}) took {2:N1}s" -f $PixiEnv, $UseXdist, $Stopwatch.Elapsed.TotalSeconds)

# Windows test matrix.
# Built against project-owned Windows Pixi images published by build_windows_pixi_envs.
# Keep this list aligned with the Pixi environments defined in pyproject.toml.

# ----- Test PyFuga on Windows (full matrix, manual) -----
test_windows_matrix:
  extends:
    - .windows_test_job
    - .rules_python_matrix_default_excluded
  image:
    name: ${CI_REGISTRY_IMAGE}/ci/windows-pixi-${PIXI_ENV}:${ENV_TAG}
    pull_policy: always
  needs:
    - job: prepare_windows_env_tag
      artifacts: true
    - job: build_windows_pixi_base
      artifacts: false
      optional: true
    - job: build_windows_pixi_envs
      artifacts: false
      optional: true
  parallel:
    matrix:
      - PYTHON_VERSION: "3.10"
        PIXI_ENV: "py310-ci"
      - PYTHON_VERSION: "3.11"
        PIXI_ENV: "py311-ci"
      - PYTHON_VERSION: "3.12"
        PIXI_ENV: "py312-ci"
      - PYTHON_VERSION: "3.13"
        PIXI_ENV: "py313-ci"
      - PYTHON_VERSION: "3.14"
        PIXI_ENV: "py314-ci"
  cache: []
  script:
    # Run tests in the version-specific Pixi environment
    - |
      $PixiEnvDir = "C:\work\.pixi\envs\$env:PIXI_ENV"
      $PythonExe = Join-Path $PixiEnvDir "python.exe"
      if (-not (Test-Path $PythonExe)) {
        throw "Expected pre-baked Python not found for $env:PIXI_ENV at $PythonExe"
      }

      if ("$env:CI_COMMIT_REF_PROTECTED" -ne "true") {
        # Compare against protected baseline to decide how to refresh the environment.
        # This captures all relevant branch changes, not only the latest push.
        git fetch origin main --quiet
        $ChangedFiles = (git diff --name-only origin/main...HEAD)
        if ($LASTEXITCODE -ne 0) { throw "Failed to diff against origin/main...HEAD" }

        $PixiLockChanged = $ChangedFiles -contains "pixi.lock"
        $PyprojectChanged = $ChangedFiles -contains "pyproject.toml"

        Push-Location "C:\work"
        if ($PixiLockChanged) {
          Write-Host "Unprotected ref: pixi.lock changed -> running frozen pixi install for $env:PIXI_ENV"
          pixi install --frozen -e $env:PIXI_ENV
          if ($LASTEXITCODE -ne 0) { throw "pixi install failed for $env:PIXI_ENV" }
        } elseif ($PyprojectChanged) {
          Write-Host "Unprotected ref: pyproject.toml changed without pixi.lock -> running editable pip install for $env:PIXI_ENV"
          & $PythonExe -m pip install -e ".[tests]"
          if ($LASTEXITCODE -ne 0) { throw "pip editable install failed for $env:PIXI_ENV" }
        } else {
          Write-Host "Unprotected ref: no pixi.lock/pyproject.toml changes -> using pre-baked $env:PIXI_ENV environment"
        }
        Pop-Location
      } else {
        Write-Host "Protected ref: using pre-baked $env:PIXI_ENV environment"
      }

      $EnvPathEntries = @(
        $PixiEnvDir,
        (Join-Path $PixiEnvDir "Library\mingw-w64\bin"),
        (Join-Path $PixiEnvDir "Library\usr\bin"),
        (Join-Path $PixiEnvDir "Library\bin"),
        (Join-Path $PixiEnvDir "Scripts"),
        (Join-Path $PixiEnvDir "bin")
      ) | Where-Object { Test-Path $_ }
      $env:PATH = ($EnvPathEntries -join ";") + ";" + $env:PATH
      $env:CONDA_PREFIX = $PixiEnvDir
      $env:CONDA_DEFAULT_ENV = $env:PIXI_ENV
      $env:CONDA_SHLVL = "1"

      & $PythonExe --version
      & $PythonExe -c "import numpy; print('numpy', numpy.__version__)"
      & $PythonExe -c "import importlib.util,sys; sys.exit(0 if importlib.util.find_spec('xdist') else 1)"
      $UseXdist = ($LASTEXITCODE -eq 0)
      $PytestArgs = @("-m", "pytest", "--import-mode=importlib", "-m", "not local", "tests/")
      if ($UseXdist) {
        Write-Host "Using pytest-xdist with 3 workers"
        $PytestArgs = @("-m", "pytest", "-n", "3", "--dist", "loadfile", "--import-mode=importlib", "-m", "not local", "tests/")
      } else {
        Write-Host "pytest-xdist not available; running serial pytest"
      }
      $Stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
      & $PythonExe @PytestArgs
      $Stopwatch.Stop()
      if ($LASTEXITCODE -ne 0) { throw "Tests failed for $env:PIXI_ENV" }
      Write-Host ("pytest (env={0}, xdist={1}) took {2:N1}s" -f $env:PIXI_ENV, $UseXdist, $Stopwatch.Elapsed.TotalSeconds)

# ----- Test PyFuga (full matrix, only when required) -----
test_linux_matrix:
  stage: test
  image: ${CI_REGISTRY_IMAGE}/ci/python-${PYTHON_VERSION}-uv-tests:latest
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13", "3.14"]
  extends:
    - .default_python_job
    - .pytest_coverage
    - .pytest_notebook_html_artifacts
    - .rules_python_matrix_default_excluded
  needs:
    - job: build_linux_test_images
      artifacts: false
      optional: true
  script:
    - python -m pytest -n 3 --dist loadfile --cov-report term-missing:skip-covered --import-mode=importlib -m "not local" tests/

# ----- Check formatting, imports and linting with Black and Ruff -----
lint:
  stage: test
  extends: .default_python_job
  script:
    - VENV_DIR=".venv-${CI_JOB_ID}"
    - uv venv "${VENV_DIR}"
    - . "${VENV_DIR}/bin/activate"
    - uv pip install ".[lint]"
    - python -m black --version
    - python -m black --check .
    - python -m ruff --version
    - python -m ruff check .
