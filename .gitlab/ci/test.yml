# Test CI configuration (pytest, matrix testing, and linting).

# ===== Test stage =====

# ----- Test PyFuga (quick, every push) -----
test_linux_default:
  stage: test
  extends:
    - .default_python_job
    - .pytest_coverage
    - .pytest_notebook_html_artifacts
    - .rules_on_code_changes
  script:
    - |
      PYV="${PYTHON_DEFAULT_VERSION/./}"          # "3.12" -> "312"
      CONSTRAINT="constraints/py${PYV}.txt"
      test -f "${CONSTRAINT}" || (echo "Missing constraints file: ${CONSTRAINT}"; exit 1)
      echo "Using constraints: ${CONSTRAINT}"
      VENV_DIR=".venv-${CI_JOB_ID}"
      uv venv "${VENV_DIR}"
      . "${VENV_DIR}/bin/activate"
      uv pip install -c "${CONSTRAINT}" ".[tests]"
    - python -m pytest --cov-report term-missing:skip-covered --cov=pyfuga --cov-config .coveragerc --import-mode=importlib -m "not local" tests/

# ----- Test PyFuga on Windows (Stage 1: default Python only) -----
test_windows_default:
  extends:
    - .windows_test_job
    - .rules_on_code_changes
  variables:
    PIXI_ENV: "py${PYTHON_DEFAULT_VERSION_TAG}-ci"
  cache:
    key: "pixi-${CI_PROJECT_ID}-${PIXI_ENV}"
    paths:
      - .cache/pixi/
    policy: pull
  script:
    # Run tests in the matching Pixi environment for the default Python version
    - $PixiEnv = "$env:PIXI_ENV"
    - pixi --version
    - |
      $InstallDuration = Measure-Command { pixi install --frozen -e $PixiEnv }
      if ($LASTEXITCODE -ne 0) {
        Write-Host "WARNING: pixi.lock is not in sync for $PixiEnv. Falling back to non-frozen install."
        $FallbackDuration = Measure-Command { pixi install -e $PixiEnv }
        Write-Host ("pixi install (fallback, env={0}) took {1:N1}s" -f $PixiEnv, $FallbackDuration.TotalSeconds)
      } else {
        Write-Host ("pixi install (--frozen, env={0}) took {1:N1}s" -f $PixiEnv, $InstallDuration.TotalSeconds)
      }
    - |
      $TestDuration = Measure-Command { pixi run -e $PixiEnv pytest --import-mode=importlib -m "not local" tests/ }
      if ($LASTEXITCODE -ne 0) { throw "Tests failed for $PixiEnv" }
      Write-Host ("pixi run pytest (env={0}) took {1:N1}s" -f $PixiEnv, $TestDuration.TotalSeconds)

# Windows test matrix.
# Built against the shared image published from the windows-pixi ltsc2019 branch
# at registry.windenergy.dtu.dk/dockerimages/windows-pixi:ltsc2019.
# Keep this list aligned with the Pixi environments defined in pyproject.toml.

# ----- Test PyFuga on Windows (full matrix, manual) -----
test_windows_matrix:
  extends:
    - .windows_test_job
    - .rules_python_matrix_default_excluded
  parallel:
    matrix:
      - PYTHON_VERSION: "3.10"
        PIXI_ENV: "py310-ci"
      - PYTHON_VERSION: "3.11"
        PIXI_ENV: "py311-ci"
      - PYTHON_VERSION: "3.12"
        PIXI_ENV: "py312-ci"
      - PYTHON_VERSION: "3.13"
        PIXI_ENV: "py313-ci"
      - PYTHON_VERSION: "3.14"
        PIXI_ENV: "py314-ci"
  cache:
    key: "pixi-${CI_PROJECT_ID}-${PIXI_ENV}"
    paths:
      - .cache/pixi/
    policy: pull
  script:
    # Run tests in the version-specific Pixi environment
    - pixi --version
    - |
      $InstallDuration = Measure-Command { pixi install --frozen -e $env:PIXI_ENV }
      if ($LASTEXITCODE -ne 0) {
        Write-Host "WARNING: pixi.lock is not in sync for $env:PIXI_ENV. Falling back to non-frozen install."
        $FallbackDuration = Measure-Command { pixi install -e $env:PIXI_ENV }
        Write-Host ("pixi install (fallback, env={0}) took {1:N1}s" -f $env:PIXI_ENV, $FallbackDuration.TotalSeconds)
      } else {
        Write-Host ("pixi install (--frozen, env={0}) took {1:N1}s" -f $env:PIXI_ENV, $InstallDuration.TotalSeconds)
      }
    - |
      $TestDuration = Measure-Command { pixi run -e $env:PIXI_ENV pytest --import-mode=importlib -m "not local" tests/ }
      if ($LASTEXITCODE -ne 0) { throw "Tests failed for $env:PIXI_ENV" }
      Write-Host ("pixi run pytest (env={0}) took {1:N1}s" -f $env:PIXI_ENV, $TestDuration.TotalSeconds)

# ----- Warm up shared Windows Pixi cache (scheduled/manual) -----
windows_pixi_cache_warmup:
  extends: .windows_test_job
  parallel:
    matrix:
      - PIXI_ENV: ["py310-ci", "py311-ci", "py312-ci", "py313-ci", "py314-ci"]
  cache:
    key: "pixi-${CI_PROJECT_ID}-${PIXI_ENV}"
    paths:
      - .cache/pixi/
    policy: pull-push
  script:
    - pixi --version
    - pixi install --frozen -e $env:PIXI_ENV
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
      allow_failure: false
    - when: manual
      allow_failure: true

# ----- Test PyFuga (full matrix, only when required) -----
test_linux_matrix:
  stage: test
  image: ${CI_REGISTRY_IMAGE}/ci/python-${PYTHON_VERSION}-uv:latest
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13", "3.14"]
  extends:
    - .default_python_job
    - .pytest_coverage
    - .pytest_notebook_html_artifacts
    - .rules_python_matrix_default_excluded
  script:
    # Install PyFuga with test dependencies and version-specific constraints
    - |
      PYV="${PYTHON_VERSION/./}"          # "3.10" -> "310"
      CONSTRAINT="constraints/py${PYV}.txt"
      test -f "${CONSTRAINT}" || (echo "Missing constraints file: ${CONSTRAINT}"; exit 1)
      echo "Using constraints: ${CONSTRAINT}"
      VENV_DIR=".venv-${CI_JOB_ID}"
      uv venv "${VENV_DIR}"
      . "${VENV_DIR}/bin/activate"
      uv pip install -c "${CONSTRAINT}" ".[tests]"

    # Run tests with coverage
    - python -m pytest --cov-report term-missing:skip-covered --import-mode=importlib -m "not local" tests/

# ----- Check formatting, imports and linting with Black and Ruff -----
lint:
  stage: test
  extends: .default_python_job
  script:
    - VENV_DIR=".venv-${CI_JOB_ID}"
    - uv venv "${VENV_DIR}"
    - . "${VENV_DIR}/bin/activate"
    - uv pip install ".[lint]"
    - python -m black --version
    - python -m black --check .
    - python -m ruff --version
    - python -m ruff check .
