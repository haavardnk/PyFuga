# ----- Compute content-derived tag for Windows Pixi images -----
# Runs on every pipeline so test jobs can always resolve the image tag,
# even when the build jobs are skipped (no dep-file changes).
prepare_windows_env_tag:
  stage: .pre
  image: alpine:latest
  cache: []
  script:
    - |
      ENV_TAG=$(cat ci/Dockerfile.windows-pixi-base ci/Dockerfile.windows-pixi-ci-env pyproject.toml pixi.lock | sha256sum | cut -c1-12)
      echo "ENV_TAG=${ENV_TAG}"
      echo "ENV_TAG=${ENV_TAG}" > env_tag.env
  artifacts:
    reports:
      dotenv: env_tag.env
  rules:
    - when: always
  tags:
    - docker
    - ubuntu
    - linux

# ----- Build Windows Pixi base image (protected refs only) -----
build_windows_pixi_base:
  stage: build
  cache: []
  needs:
    - job: prepare_windows_env_tag
      artifacts: true
  script:
    - $DockerConfigDir = Join-Path $env:CI_PROJECT_DIR ".docker-tmp"
    - New-Item -ItemType Directory -Force -Path $DockerConfigDir | Out-Null
    - $env:DOCKER_CONFIG = $DockerConfigDir
    - $BaseRepo = "$env:CI_REGISTRY_IMAGE/ci/windows-pixi-base"
    - $DestTag = "${BaseRepo}:$env:ENV_TAG"
    - $DestLatest = "${BaseRepo}:latest"
    - docker version
    - docker system df
    - $env:CI_REGISTRY_PASSWORD | docker login $env:CI_REGISTRY --username $env:CI_REGISTRY_USER --password-stdin
    - |
      docker pull $DestLatest
      if ($LASTEXITCODE -ne 0) {
        Write-Host "No existing cache image for $DestLatest (first build or cache miss)."
        $global:LASTEXITCODE = 0
      } else {
        Write-Host "Using cache image: $DestLatest"
      }
    - docker build --pull --cache-from $DestLatest -f ci/Dockerfile.windows-pixi-base -t $DestTag -t $DestLatest .
    - docker push $DestTag
    - docker push $DestLatest
    - |
      $ProjectImagePrefix = "$env:CI_REGISTRY_IMAGE/ci/windows-pixi"
      $ProjectImagesToDelete = docker image ls --format "{{.Repository}}:{{.Tag}}" |
        Where-Object { $_ -like "$ProjectImagePrefix*" -and $_ -notmatch ":(latest|$($env:ENV_TAG))$" }
      if ($ProjectImagesToDelete) {
        Write-Host "Removing old project images after push (keeping :latest and :$env:ENV_TAG):"
        $ProjectImagesToDelete | ForEach-Object { Write-Host " - $_" }
        $ProjectImagesToDelete | ForEach-Object { docker image rm -f $_ }
      } else {
        Write-Host "No old project images to remove after push."
      }
    - Remove-Item -Recurse -Force $DockerConfigDir
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - ci/Dockerfile.windows-pixi-base
        - .gitlab/ci/build.yml
      when: on_success
      allow_failure: false
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $FORCE_WINDOWS_IMAGE_BUILD == "1"'
      when: manual
      allow_failure: true
    - when: never
  tags:
    - windows
    - docker
    - shell

# ----- Build Windows Pixi per-environment images (protected refs only) -----
build_windows_pixi_envs:
  stage: build
  cache: []
  needs:
    - job: prepare_windows_env_tag
      artifacts: true
    - job: build_windows_pixi_base
  parallel:
    matrix:
      - PIXI_ENV: ["py310-ci", "py311-ci", "py312-ci", "py313-ci", "py314-ci"]
  script:
    - $DockerConfigDir = Join-Path $env:CI_PROJECT_DIR ".docker-tmp"
    - New-Item -ItemType Directory -Force -Path $DockerConfigDir | Out-Null
    - $env:DOCKER_CONFIG = $DockerConfigDir
    - $BaseImage = "$env:CI_REGISTRY_IMAGE/ci/windows-pixi-base:$env:ENV_TAG"
    - $EnvRepo = "$env:CI_REGISTRY_IMAGE/ci/windows-pixi-$env:PIXI_ENV"
    - $DestTag = "${EnvRepo}:$env:ENV_TAG"
    - $DestLatest = "${EnvRepo}:latest"
    - docker version
    - docker system df
    - $env:CI_REGISTRY_PASSWORD | docker login $env:CI_REGISTRY --username $env:CI_REGISTRY_USER --password-stdin
    - |
      docker pull $DestLatest
      if ($LASTEXITCODE -ne 0) {
        Write-Host "No existing cache image for $DestLatest (first build or cache miss)."
        $global:LASTEXITCODE = 0
      } else {
        Write-Host "Using cache image: $DestLatest"
      }
    - docker build --pull `
      --cache-from $DestLatest `
      --build-arg BASE_IMAGE=$BaseImage `
      --build-arg PIXI_ENV=$env:PIXI_ENV `
      -f ci/Dockerfile.windows-pixi-ci-env `
      -t $DestTag -t $DestLatest .
    - docker push $DestTag
    - docker push $DestLatest
    - |
      $ProjectImagePrefix = "$env:CI_REGISTRY_IMAGE/ci/windows-pixi"
      $ProjectImagesToDelete = docker image ls --format "{{.Repository}}:{{.Tag}}" |
        Where-Object { $_ -like "$ProjectImagePrefix*" -and $_ -notmatch ":(latest|$($env:ENV_TAG))$" }
      if ($ProjectImagesToDelete) {
        Write-Host "Removing old project images after push (keeping :latest and :$env:ENV_TAG):"
        $ProjectImagesToDelete | ForEach-Object { Write-Host " - $_" }
        $ProjectImagesToDelete | ForEach-Object { docker image rm -f $_ }
      } else {
        Write-Host "No old project images to remove after push."
      }
    - Remove-Item -Recurse -Force $DockerConfigDir
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - ci/Dockerfile.windows-pixi-base
        - ci/Dockerfile.windows-pixi-ci-env
        - .gitlab/ci/build.yml
        - pyproject.toml
        - pixi.lock
      when: on_success
      allow_failure: false
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $FORCE_WINDOWS_IMAGE_BUILD == "1"'
      when: manual
      allow_failure: true
    - when: never
  tags:
    - windows
    - docker
    - shell

# ===== Documentation builds =====

# ----- Build docs on every push (for preview / CI sanity) -----
build_docs:
  stage: build
  extends: .default_python_job
  image: ${CI_REGISTRY_IMAGE}/ci/python-${PYTHON_DEFAULT_VERSION}-uv-docs:latest
  script:
    - VENV_DIR=".venv-${CI_JOB_ID}"
    - uv venv "${VENV_DIR}"
    - . "${VENV_DIR}/bin/activate"
    - uv pip install ".[docs]"
    - cd docs
    - sphinx-build -b html . _build # for branch builds, a simple single-version build is enough
  artifacts:
    paths:
      - docs/_build
    expire_in: 1 week
  rules:
    # Never run on main, since main will use the pages build/deploy jobs to build the full multiversion docs for the official site
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: never

    # Also skip on tags, since they will also trigger the pages build/deploy jobs which build the full multiversion docs
    - if: "$CI_COMMIT_TAG"
      when: never

    # Auto if branch name contains "docs"
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH =~ /^docs\//'
      when: on_success
      allow_failure: false

    # Otherwise manual
    - when: manual
      allow_failure: true

# ----- Build PyFuga docs for GitLab Pages (official site) -----
build_pages:
  stage: build
  extends: .default_python_job
  image: ${CI_REGISTRY_IMAGE}/ci/python-${PYTHON_DEFAULT_VERSION}-uv-docs:latest
  script:
    - VENV_DIR=".venv-${CI_JOB_ID}"
    - uv venv "${VENV_DIR}"
    - . "${VENV_DIR}/bin/activate"
    - uv pip install ".[docs]"

    # --- Make sure sphinx-multiversion can see refs ------------
    # Fetch complete history (in case job is still shallow)
    - git fetch --unshallow --tags || git fetch --tags
    # Fetch all remote branches as local remote-tracking branches
    - git fetch origin "+refs/heads/*:refs/remotes/origin/*"
    # -----------------------------------------------------------

    - cd docs
    - sphinx-multiversion . _build

    # --- Choose default ref for root index.html safely ---------
    # Always point landing page to main so newly added docs are visible immediately.
    - DEFAULT_REF="main"
    - test -d "_build/${DEFAULT_REF}" || (echo "Missing _build/${DEFAULT_REF} from sphinx-multiversion output"; find _build -maxdepth 2 -type d | sort; exit 1)
    - echo "Using DEFAULT_REF=${DEFAULT_REF}"

    # Create root index.html from template
    - sed "s/TAG/${DEFAULT_REF}/g" root_index_template.html > _build/index.html
    # -----------------------------------------------------------

    - cd ..
    - mv docs/_build public/

    # Canonicalize branch root URLs to explicit index files
    - |
      cat > public/_redirects << 'EOF'
      /main /main/index.html 301
      /main/ /main/index.html 301
      EOF

    # --- CI sanity checks for expected published paths ----------
    - test -d "public/main" || (echo "Missing public/main after docs build"; find public -maxdepth 2 -type d | sort; exit 1)
    - test -f "public/main/theory/ffit.html" || (echo "Missing public/main/theory/ffit.html"; find public/main/theory -maxdepth 1 -type f | sort; exit 1)
  artifacts:
    paths:
      - public
  rules:
    # Only build docs for main branch and tags (releases)
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
      when: on_success
      allow_failure: false

    # Otherwise never run
    - when: never

# ===== Release artifact builds =====

# ----- Build and validate release artifacts (no publish) -----
build_release_artifacts:
  stage: build
  extends: .default_python_job
  script:
    - VENV_DIR=".venv-${CI_JOB_ID}"
    - uv venv "${VENV_DIR}"
    - . "${VENV_DIR}/bin/activate"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG_VERSION="${CI_COMMIT_TAG#v}"
        PYPROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
        test "$TAG_VERSION" = "$PYPROJECT_VERSION" || {
          echo "Tag version ($TAG_VERSION) does not match pyproject.toml version ($PYPROJECT_VERSION)"
          exit 1
        }
      fi
    - uv pip install build twine
    - python -m build
    - python scripts/sync_conda_recipe.py --check
    - python -m twine check dist/*
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    # Always validate artifacts for tags/releases
    - if: "$CI_COMMIT_TAG"
      when: on_success
      allow_failure: false

    # Optional manual run on branches
    - when: manual
      allow_failure: true
