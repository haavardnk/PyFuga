# Deploy CI configuration (GitLab Pages publishing and package publication).

# ===== Deploy stage =====

# ----- Deploy prebuilt docs to GitLab Pages -----
pages:
  stage: deploy
  needs:
    - job: build_pages
      artifacts: true
  script:
    - test -d "public" || (echo "Missing public artifact from build_pages"; exit 1)
  artifacts:
    paths:
      - public
  rules:
    # Only build and deploy docs for main branch and tags (releases)
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
      when: on_success
      allow_failure: false

    # Otherwise never run
    - when: never

# ----- Publish PyFuga to PyPI (protected tags only) -----
publish_pypi:
  stage: deploy
  extends: .default_python_job
  needs:
    - job: build_release_artifacts
      artifacts: true
  script:
    - test -n "$TWINE_USERNAME" || (echo "TWINE_USERNAME is not set"; exit 1)
    - test -n "$TWINE_PASSWORD" || (echo "TWINE_PASSWORD is not set"; exit 1)
    - VENV_DIR=".venv-${CI_JOB_ID}"
    - uv venv "${VENV_DIR}"
    - . "${VENV_DIR}/bin/activate"
    - uv pip install twine
    - python -m twine upload -u "$TWINE_USERNAME" -p "$TWINE_PASSWORD" dist/*
  rules:
    # Publish only for protected tags when credentials are configured
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true" && $TWINE_USERNAME && $TWINE_PASSWORD'
      when: on_success
      allow_failure: false

    # Otherwise never run
    - when: never

# ----- Publish PyFuga to TestPyPI (protected tags only) -----
publish_testpypi:
  stage: deploy
  extends: .default_python_job
  needs:
    - job: build_release_artifacts
      artifacts: true
  script:
    - test -n "$TEST_PYPI_TOKEN" || (echo "TEST_PYPI_TOKEN is not set"; exit 1)
    - VENV_DIR=".venv-${CI_JOB_ID}"
    - uv venv "${VENV_DIR}"
    - . "${VENV_DIR}/bin/activate"
    - uv pip install twine
    - python -m twine upload --repository-url https://test.pypi.org/legacy/ -u __token__ -p "$TEST_PYPI_TOKEN" dist/*
  rules:
    # Publish only for protected tags when token is configured
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true" && $TEST_PYPI_TOKEN'
      when: on_success
      allow_failure: false

    # Otherwise never run
    - when: never
