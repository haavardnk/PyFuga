# ===== Deploy stage =====

# ----- Build PyFuga docs for GitLab Pages (official site) -----
docs_pages:
  stage: deploy
  extends: .default_python_job
  image: ${CI_REGISTRY_IMAGE}/ci/python-${PYTHON_DEFAULT_VERSION}-uv-docs:latest
  script:
    - VENV_DIR=".venv-${CI_JOB_ID}"
    - uv venv "${VENV_DIR}"
    - . "${VENV_DIR}/bin/activate"
    - uv pip install ".[docs]"

    # --- Make sure sphinx-multiversion can see refs ------------
    # Fetch complete history (in case job is still shallow)
    - git fetch --unshallow --tags || git fetch --tags
    # Fetch all remote branches as local remote-tracking branches
    - git fetch origin "+refs/heads/*:refs/remotes/origin/*"
    # -----------------------------------------------------------

    - cd docs
    - sphinx-multiversion . _build

    # --- Choose default ref for root index.html safely ---------
    # Always point the landing page to `main` so newly added docs are visible
    # immediately after merge, even if older release tags don't contain them.
    - DEFAULT_REF="main"
    - test -d "_build/${DEFAULT_REF}" || (echo "Missing _build/${DEFAULT_REF} from sphinx-multiversion output"; ls -la _build; exit 1)
    - echo "Using DEFAULT_REF=${DEFAULT_REF}"

    # Create root index.html from template
    - sed "s/TAG/${DEFAULT_REF}/g" root_index_template.html > _build/index.html
    # -----------------------------------------------------------

    - cd ..
    - mv docs/_build public/
  artifacts:
    paths:
      - public
  rules:
    # Only build and deploy docs for main branch and tags (releases)
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
      when: on_success
      allow_failure: false

    # Otherwise never run
    - when: never

# ----- Publish PyFuga to PyPI (protected tags only) -----
publish_pypi:
  stage: deploy
  extends: .default_python_job
  needs:
    - job: build_release_artifacts
      artifacts: true
  script:
    - test -n "$TWINE_USERNAME" || (echo "TWINE_USERNAME is not set"; exit 1)
    - test -n "$TWINE_PASSWORD" || (echo "TWINE_PASSWORD is not set"; exit 1)
    - VENV_DIR=".venv-${CI_JOB_ID}"
    - uv venv "${VENV_DIR}"
    - . "${VENV_DIR}/bin/activate"
    - uv pip install twine
    - python -m twine upload -u "$TWINE_USERNAME" -p "$TWINE_PASSWORD" dist/*
  rules:
    # Publish only for protected tags when credentials are configured
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true" && $TWINE_USERNAME && $TWINE_PASSWORD'
      when: on_success
      allow_failure: false

    # Otherwise never run
    - when: never

# ----- Publish PyFuga to TestPyPI (protected tags only) -----
publish_testpypi:
  stage: deploy
  extends: .default_python_job
  needs:
    - job: build_release_artifacts
      artifacts: true
  script:
    - test -n "$TEST_PYPI_TOKEN" || (echo "TEST_PYPI_TOKEN is not set"; exit 1)
    - VENV_DIR=".venv-${CI_JOB_ID}"
    - uv venv "${VENV_DIR}"
    - . "${VENV_DIR}/bin/activate"
    - uv pip install twine
    - python -m twine upload --repository-url https://test.pypi.org/legacy/ -u __token__ -p "$TEST_PYPI_TOKEN" dist/*
  rules:
    # Publish only for protected tags when token is configured
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true" && $TEST_PYPI_TOKEN'
      when: on_success
      allow_failure: false

    # Otherwise never run
    - when: never
