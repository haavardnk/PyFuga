# Deploy CI configuration (GitLab Pages publishing and package publication).

# ===== Deploy stage =====

# ----- Deploy prebuilt docs to GitLab Pages -----
pages:
  stage: deploy
  needs:
    - job: build_pages
      artifacts: true
  script:
    - test -d "public" || (echo "Missing public artifact from build_pages"; exit 1)
  artifacts:
    paths:
      - public
  rules:
    # Only build and deploy docs for main branch and tags (releases)
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
      when: on_success
      allow_failure: false

    # Otherwise never run
    - when: never

# ----- Publish PyFuga to PyPI (protected tags only) -----
publish_pypi:
  stage: deploy
  extends: .default_python_job
  needs:
    - job: build_release_artifacts
      artifacts: true
  script:
    - test -n "$TWINE_USERNAME" || (echo "TWINE_USERNAME is not set"; exit 1)
    - test -n "$TWINE_PASSWORD" || (echo "TWINE_PASSWORD is not set"; exit 1)
    - VENV_DIR=".venv-${CI_JOB_ID}"
    - uv venv "${VENV_DIR}"
    - . "${VENV_DIR}/bin/activate"
    - uv pip install twine
    - python -m twine upload -u "$TWINE_USERNAME" -p "$TWINE_PASSWORD" dist/*
  rules:
    # Publish only for protected tags when credentials are configured
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true" && $TWINE_USERNAME && $TWINE_PASSWORD'
      when: on_success
      allow_failure: false

    # Otherwise never run
    - when: never

# ----- Publish PyFuga to GitLab PyPI registry (private/manual test) -----
publish_gitlab_pypi:
  stage: deploy
  extends: .default_python_job
  needs:
    - job: build_release_artifacts
      artifacts: true
  script:
    - test -n "$CI_JOB_TOKEN" || (echo "CI_JOB_TOKEN is not set"; exit 1)
    - VENV_DIR=".venv-${CI_JOB_ID}"
    - uv venv "${VENV_DIR}"
    - . "${VENV_DIR}/bin/activate"
    - uv pip install twine
    - python -m twine upload --repository-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi" -u gitlab-ci-token -p "$CI_JOB_TOKEN" dist/*
  rules:
    # Manual private test publish on this branch
    - if: '$CI_COMMIT_BRANCH == "test-pypi"'
      when: manual
      allow_failure: true

    # Otherwise never run
    - when: never

# ----- Verify PyFuga install from GitLab PyPI registry (private/manual test) -----
verify_gitlab_pypi:
  stage: deploy
  extends: .default_python_job
  needs:
    - job: publish_gitlab_pypi
  script:
    - test -n "$CI_JOB_TOKEN" || (echo "CI_JOB_TOKEN is not set"; exit 1)
    - VENV_DIR=".venv-${CI_JOB_ID}"
    - uv venv "${VENV_DIR}"
    - . "${VENV_DIR}/bin/activate"
    - PYPROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
    - uv pip install --index-url "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/pypi/simple" --no-deps "pyfuga==${PYPROJECT_VERSION}"
    - |
      python -c 'import importlib.metadata, pyfuga, tomllib; expected=tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; metadata_version=importlib.metadata.version("pyfuga"); attr_version=pyfuga.__version__; print(f"Installed pyfuga metadata={metadata_version}, attr={attr_version}"); assert metadata_version == expected, f"Metadata version mismatch: expected {expected}, got {metadata_version}"; assert attr_version == expected, f"pyfuga.__version__ mismatch: expected {expected}, got {attr_version}"'
  rules:
    - if: '$CI_COMMIT_BRANCH == "test-pypi"'
      when: manual
      allow_failure: true
    - when: never

# ----- Build PyFuga conda package from published PyPI source -----
build_conda:
  stage: deploy
  image: condaforge/miniforge3:latest
  needs:
    - job: publish_pypi
  script:
    - mamba install -c conda-forge --override-channels -y conda-build
    - python -m build --sdist
    - |
      for i in 1 2 3 4 5 6; do
        python scripts/sync_conda_recipe.py --check --check-remote-source && break
        if [ "$i" -eq 6 ]; then
          echo "Remote source checksum verification failed after ${i} attempts"
          exit 1
        fi
        echo "Remote source not ready yet (attempt ${i}/6), retrying in 20s..."
        sleep 20
      done
    - conda build --no-anaconda-upload -c conda-forge --override-channels --output-folder ./conda_channel conda-recipe/
  artifacts:
    untracked: false
    expire_in: "1 week"
    paths:
      - conda_channel/noarch/pyfuga*
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
      when: on_success
      allow_failure: false
    - when: never
  tags:
    - docker
    - ubuntu
    - linux

# ----- Deploy PyFuga conda package to internal channel -----
deploy_conda:
  stage: deploy
  image: condaforge/miniforge3:latest
  needs:
    - job: build_conda
      artifacts: true
  script:
    - |
      for PKG in conda_channel/noarch/pyfuga*.tar.bz2 conda_channel/noarch/pyfuga*.conda; do
        [ -f "$PKG" ] || continue
        BASENAME=$(basename "$PKG")
        cp -p "$PKG" /conda_channel_open/noarch/${BASENAME}.tmp
        chown 1000:1000 /conda_channel_open/noarch/${BASENAME}.tmp
        mv /conda_channel_open/noarch/${BASENAME}.tmp /conda_channel_open/noarch/${BASENAME}
        echo "Deployed ${BASENAME}"
      done
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
      when: on_success
      allow_failure: false
    - when: never
  tags:
    - conda_channel

# ----- Publish PyFuga to TestPyPI (protected tags only) -----
publish_testpypi:
  stage: deploy
  extends: .default_python_job
  needs:
    - job: build_release_artifacts
      artifacts: true
  script:
    - test -n "$TEST_PYPI_TOKEN" || (echo "TEST_PYPI_TOKEN is not set"; exit 1)
    - VENV_DIR=".venv-${CI_JOB_ID}"
    - uv venv "${VENV_DIR}"
    - . "${VENV_DIR}/bin/activate"
    - uv pip install twine
    - python -m twine upload --skip-existing --repository-url https://test.pypi.org/legacy/ -u "__token__" -p "$TEST_PYPI_TOKEN" dist/*
  rules:
    # Publish on protected tags when credentials are configured
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true" && $TEST_PYPI_TOKEN'
      when: on_success
      allow_failure: false

    # Temporary manual smoke test on this branch
    - if: '$CI_COMMIT_BRANCH == "test-pypi" && $TEST_PYPI_TOKEN'
      when: manual
      allow_failure: true

    # Otherwise never run
    - when: never

# ----- Publish PyFuga source to Zenodo on protected version tags -----
publish_zenodo:
  stage: deploy
  extends: .default_python_job
  script:
    - |
      # Token precedence:
      # Explicit sandbox/production token for the selected target.
      if [ "${ZENODO_SANDBOX:-false}" = "true" ]; then
        ZENODO_TOKEN="${ZENODO_SANDBOX_TOKEN}"
      else
        ZENODO_TOKEN="${ZENODO_PRODUCTION_TOKEN}"
      fi
      if [ -z "$ZENODO_TOKEN" ]; then
        echo "No Zenodo token configured for selected target."
        echo "Set ZENODO_SANDBOX_TOKEN or ZENODO_PRODUCTION_TOKEN."
        exit 1
      fi
    - TAG_VERSION="${CI_COMMIT_TAG#v}"
    - ARCHIVE_NAME="${TAG_VERSION}.zip"
    - |
      # Create a zip snapshot of the exact Git tag commit.
      git archive --format zip --output "${ARCHIVE_NAME}" "${CI_COMMIT_TAG}"
    - uv pip install gitlab2zenodo
    - |
      ZENODO_RECORD="${ZENODO_RECORD:-${zenodo_record}}"
      SANDBOX_ARGS=""
      if [ "${ZENODO_SANDBOX:-false}" = "true" ]; then
        SANDBOX_ARGS="-s"
      fi

      PUBLISH_ARGS=""
      # Default to "draft" (no auto-publish).
      if [ "${ZENODO_AUTO_PUBLISH:-false}" = "true" ]; then
        PUBLISH_ARGS="-p"
      fi

      if [ -n "${ZENODO_RECORD}" ]; then
        g2z-send -i "${ZENODO_RECORD}" -t "${ZENODO_TOKEN}" ${SANDBOX_ARGS} ${PUBLISH_ARGS} -m .zenodo.json "${ARCHIVE_NAME}"
      else
        # First run creates a new Zenodo record; capture the produced deposition id/DOI from logs,
        # then set ZENODO_RECORD for future tags to create new versions instead of new records.
        g2z-send -t "${ZENODO_TOKEN}" ${SANDBOX_ARGS} ${PUBLISH_ARGS} -m .zenodo.json "${ARCHIVE_NAME}"
      fi
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG =~ /^v?\d+\.\d+(\.\d+)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
      when: on_success
      allow_failure: false
    - when: never

# ----- Manual Zenodo upload for an existing tag -----
# Used to test the Zenodo integration for an already-published tag (e.g. v0.1.0)
# without creating a new release tag.
zenodo_upload_for_tag:
  stage: deploy
  extends: .default_python_job
  script:
    - |
      if [ "${ZENODO_USE_SANDBOX:-true}" = "true" ]; then
        ZENODO_TOKEN="${ZENODO_SANDBOX_TOKEN}"
      else
        ZENODO_TOKEN="${ZENODO_PRODUCTION_TOKEN}"
      fi
      if [ -z "$ZENODO_TOKEN" ]; then
        echo "No Zenodo token configured for selected target."
        echo "Set ZENODO_SANDBOX_TOKEN or ZENODO_PRODUCTION_TOKEN."
        exit 1
      fi
    - |
      TARGET_TAG="${ZENODO_TARGET_TAG:-$CI_COMMIT_TAG}"
      if [ -z "$TARGET_TAG" ]; then
        echo "ZENODO_TARGET_TAG is not set (example: v0.1.0)"
        exit 1
      fi
    - TAG_VERSION="${TARGET_TAG#v}"
    - ARCHIVE_NAME="zenodo-upload-${TAG_VERSION}.zip"
    - |
      # Ensure tag exists in this clone.
      git fetch --tags || true
      git archive --format zip --output "${ARCHIVE_NAME}" "${TARGET_TAG}"
    - uv pip install gitlab2zenodo
    - |
      ZENODO_RECORD="${ZENODO_RECORD:-${zenodo_record}}"
      SANDBOX_ARGS=""
      if [ "${ZENODO_USE_SANDBOX:-true}" = "true" ]; then
        SANDBOX_ARGS="-s"
      fi

      PUBLISH_ARGS=""
      # Keep manual path safe by default (create draft only).
      if [ "${ZENODO_AUTO_PUBLISH:-false}" = "true" ]; then
        PUBLISH_ARGS="-p"
      fi

      if [ -n "${ZENODO_RECORD}" ]; then
        g2z-send -i "${ZENODO_RECORD}" -t "${ZENODO_TOKEN}" ${SANDBOX_ARGS} ${PUBLISH_ARGS} -m .zenodo.json "${ARCHIVE_NAME}"
      else
        g2z-send -t "${ZENODO_TOKEN}" ${SANDBOX_ARGS} ${PUBLISH_ARGS} -m .zenodo.json "${ARCHIVE_NAME}"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
    - when: never
