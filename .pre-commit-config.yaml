repos:
  - repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
      - id: black
        language_version: python3
        additional_dependencies:
          - "black[jupyter]"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.8
    hooks:
      - id: ruff-check
        name: ruff-imports
        args: [--select, I, --fix, --exit-non-zero-on-fix]
